name: Build Billu Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy root index.html into Android Assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (Pre-Signed for Direct Install)
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for Easy Download
        run: cp app/build/outputs/apk/debug/app-debug.apk Billu-Printer.apk

      - name: Upload Billu-Printer.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Billu-Printer-APK
          path: Billu-Printer.apk
          retention-days: 90